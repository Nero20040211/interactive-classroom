const MATHML_NATIVE=typeof MathMLElement!=='undefined';if(!MATHML_NATIVE)document.documentElement.classList.add('no-mathml');
const course={{COURSE_JSON}};
const initialState={sceneId:course.scenes?.[0]?.id??null,answers:{},discussion:{},graphPositions:{},selected:{},simulation:{},pbl:{},reflection:{},widget:{},guide:{},games:{},code:{},procedure:{},ordering:{},semantic:{},proofPractice:{},quantity:{},chemistry:{},animation:{},dataLab:{},motion:{},geometry:{},fbd:{},circuit:{},molecule:{},genetics:{},stats:{},searchTree:{},mlBoundary:{},mapLab:{},dataStructure:{},recursion:{},complexity:{},language:{},humanities:{},socialScience:{},explainBack:{},solidGeometry:{},spaceGeometry:{},processAnimation:{},randomTrial:{},sessionFeedback:{observations:[]},nav:{query:'',bookmarks:[],bookmarksOnly:false}};

const host=document.querySelector('#sceneHost'),nav=document.querySelector('#sceneNav'),lessonToc=document.querySelector('#lessonToc'),roleStrip=document.querySelector('#roleStrip'),liveStatus=document.querySelector('#liveStatus'),progressBar=document.querySelector('#progressBar'),progressText=document.querySelector('#progressText'),disciplineBadge=document.querySelector('#disciplineBadge'),bookmarkCurrentBtn=document.querySelector('#bookmarkCurrentBtn'),bookmarksOnlyBtn=document.querySelector('#bookmarksOnlyBtn'),bibliographyBtn=document.querySelector('#bibliographyBtn'),bibliographyDialog=document.querySelector('#bibliographyDialog'),bibliographyBody=document.querySelector('#bibliographyBody'),feedbackBtn=document.querySelector('#feedbackBtn'),feedbackDialog=document.querySelector('#feedbackDialog'),feedbackSceneTitle=document.querySelector('#feedbackSceneTitle'),feedbackNote=document.querySelector('#feedbackNote'),feedbackScope=document.querySelector('#feedbackScope'),feedbackCount=document.querySelector('#feedbackCount');

const toneColor=t=>({'teacher':'var(--teacher)','curious':'var(--curious)','skeptic':'var(--skeptic)','evidence':'var(--evidence)','examiner':'var(--examiner)','specialist':'var(--specialist)'})[t]||'var(--accent)';
function renderRoles(){roleStrip.innerHTML='';const scene=sceneById(state.sceneId),stage=course.stages?.find(s=>s.id===scene?.stageId),allowed=stage?.roster?.length?new Set(stage.roster):null;(course.roles||[]).filter(r=>!allowed||allowed.has(r.id)).forEach(r=>{const el=document.createElement('div');el.className='role-chip';el.innerHTML=`<span class="avatar" style="background:${toneColor(r.tone)}">${esc(r.avatar||r.name?.slice(0,1)||'·')}</span><span><span class="role-name">${esc(r.name)}</span><br><span class="role-fn">${esc(r.function||'课堂角色')}</span></span>`;roleStrip.appendChild(el)})}
function sceneLabel(scene){const t=scene.type;if(t==='orientation')return '学习导览';if(t==='concept')return '概念讲解';if(t==='discussion')return '观点讨论';if(t==='quiz')return '理解检测';if(t==='mastery')return '掌握检测';if(t==='pbl')return '情境任务';if(t==='reflection')return '反思总结';if(t==='explain-back')return '复述自检';if(t==='interactive'){const w=scene.content?.widgetType||'互动';return ({simulation:'互动实验',visualization3d:'空间探索',game:'学习挑战',code:'代码实验',diagram:'图解关系','procedural-skill':'步骤练习',equation:'公式推导','data-lab':'参数与数据实验',annotation:'标注精读',media:'媒体学习','proof-practice':'证明练习','quantity-lab':'量纲与数值实验',chemistry:'化学配平实验','motion-lab':'运动实验室','geometry-lab':'几何实验室','fbd-lab':'受力图实验','circuit-lab':'电路实验','molecule-lab':'分子结构','genetics-lab':'遗传实验','stats-lab':'统计实验','search-tree-lab':'搜索树实验','ml-boundary-lab':'决策边界实验','map-lab':'空间分析地图','data-structure-lab':'数据结构实验','recursion-lab':'递归调用栈','complexity-lab':'复杂度实验','cloze-lab':'完形填空实验','sentence-builder-lab':'句子构建实验','grammar-tree-lab':'语法结构实验','source-comparison-lab':'史料/文本比较','argument-map-lab':'论证结构实验','causal-dag-lab':'因果图实验','evidence-matrix-lab':'证据矩阵实验','solid-geometry-lab':'立体几何参数实验','space-geometry-lab':'空间关系实验','process-animation':'过程动画','random-trial-lab':'随机试验实验室'})[w]||'互动学习'}return '学习场景'}
function disciplineLabel(id){return ({'formal-quantitative':'形式与定量','physical-experimental':'物理与实验','life-clinical':'生命与临床','computational-data':'计算与数据','social-decision':'社会与决策','historical-interpretive':'历史与解释','language-communication':'语言与沟通','visual-spatial-creative':'视觉与空间','procedural-vocational':'程序与技能',mixed:'跨学科'})[id]||id||'自动路由'}
function sceneSearchText(s){return `${s.title||''} ${sceneLabel(s)} ${JSON.stringify(s.knowledge||s.content?.knowledge||{})}`.toLowerCase()}
function applyNavFilter(){const q=(state.nav.query||'').trim().toLowerCase(),only=!!state.nav.bookmarksOnly;nav.querySelectorAll('button[data-action="goto"]').forEach(b=>{const match=!q||(b.dataset.search||'').includes(q),marked=(state.nav.bookmarks||[]).includes(b.dataset.sceneId);b.hidden=!(match&&(!only||marked))});nav.querySelectorAll('.stage-label').forEach(l=>{let el=l.nextElementSibling,show=false;while(el&& !el.classList.contains('stage-label')){if(el.matches?.('button[data-action="goto"]')&&!el.hidden){show=true;break}el=el.nextElementSibling}l.hidden=!show});const empty=nav.querySelector('.nav-empty');if(empty)empty.hidden=[...nav.querySelectorAll('button[data-action="goto"]')].some(b=>!b.hidden)}
function renderNav(){nav.innerHTML=`<div class="nav-tools"><label class="sr-only" for="sceneSearch">搜索课程</label><input id="sceneSearch" class="nav-search" type="search" placeholder="搜索章节 / 概念" value="${esc(state.nav.query||'')}"></div>`;let lastStage=null;(course.scenes||[]).forEach((s,i)=>{if(s.stageId!==lastStage){lastStage=s.stageId;const st=course.stages?.find(x=>x.id===lastStage);if(st){const label=document.createElement('div');label.className='stage-label';label.textContent=st.title||'学习阶段';nav.appendChild(label)}}const b=document.createElement('button');b.type='button';b.dataset.action='goto';b.dataset.sceneId=s.id;b.dataset.search=sceneSearchText(s);const marked=(state.nav.bookmarks||[]).includes(s.id);b.innerHTML=`<span class="scene-index">${i+1}</span><span class="scene-title">${esc(s.title)}${marked?` <span class="bookmark-star" aria-label="已收藏">★</span>`:''}</span><span class="scene-type-mini">${esc(sceneLabel(s))}</span>`;if(s.id===state.sceneId)b.setAttribute('aria-current','step');nav.appendChild(b)});const empty=document.createElement('div');empty.className='nav-empty';empty.hidden=true;empty.textContent='没有匹配的章节。';nav.appendChild(empty);applyNavFilter();const i=Math.max(0,course.scenes.findIndex(s=>s.id===state.sceneId)),pct=course.scenes.length?Math.round((i+1)/course.scenes.length*100):0;progressBar.style.width=pct+'%';progressText.textContent=pct+'%';const d=course.meta?.discipline;if(disciplineBadge){const primary=typeof d==='string'?d:d?.primary;disciplineBadge.textContent=primary?`自适应 · ${disciplineLabel(primary)}`:'自适应学习路径'}const marked=(state.nav.bookmarks||[]).includes(state.sceneId);bookmarkCurrentBtn?.setAttribute('aria-pressed',String(marked));if(bookmarkCurrentBtn)bookmarkCurrentBtn.textContent=marked?'★ 已收藏':'☆ 收藏本页';bookmarksOnlyBtn?.setAttribute('aria-pressed',String(!!state.nav.bookmarksOnly))}

function guideState(scene){state.guide[scene.id]??={index:0,highlight:null,hint:'',patch:{},reveal:0};return state.guide[scene.id]}
function guidePanel(scene){const acts=scene.actions||[];if(!acts.length)return'';const g=guideState(scene),current=g.index>0?acts[g.index-1]:null,actor=current?roleById(current.actorId):null;return `<div class="guide"><div class="guide-row"><div><strong>教师引导</strong> <span class="badge">${g.index}/${acts.length}</span>${actor?` <span class="badge">${esc(actor.name)}</span>`:''}</div><div class="actions"><button type="button" data-action="guide-next" ${g.index>=acts.length?'disabled':''}>下一步引导</button><button type="button" data-action="guide-reset">重播</button></div></div>${current?.narration?`<p>${esc(current.narration)}</p>`:''}${g.hint?`<div class="callout warn">提示：${esc(g.hint)}</div>`:''}</div>`}
function richAtom(x){if(x==null)return'';if(typeof x==='string')return prose(x);if(Array.isArray(x))return x.map(richAtom).join('');if(typeof x!=='object')return prose(String(x));if(x.mathml&&(x.tex||x.spoken||x.ariaLabel))return renderFormula(x,x.display==='inline'?'inline':'block',x.display==='inline'?'rich-inline-formula':'math-narrative');if(x.formula)return `${x.text?prose(x.text):''}${renderFormula(x.formula,x.display==='inline'?'inline':'block')}${x.after?prose(x.after):''}`;if(x.parts?.length){const bits=x.parts.map(part=>{if(typeof part==='string')return esc(part);if(part?.text)return esc(part.text);if(part?.formula)return renderFormula(part.formula,'inline','rich-inline-formula');return''}).join('');return `<p>${bits}</p>`}if(x.text||x.body)return prose(x.text||x.body);return''}

function listItem(x){if(typeof x==='string')return `<li>${esc(x)}</li>`;if(x&&typeof x==='object')return `<li>${x.text?esc(x.text):''}${x.formula?renderFormula(x.formula,x.display==='inline'?'inline':'block'):''}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</li>`;return''}

function safeMathML(raw,display='block',ariaLabel=''){if(!raw)return'';try{const doc=new DOMParser().parseFromString(String(raw),'application/xml'),root=doc.documentElement;if(root.tagName.toLowerCase()!=='math'||doc.querySelector('parsererror'))return'';for(const el of [root,...root.querySelectorAll('*')]){const tag=el.tagName.toLowerCase();if(!MATHML_TAGS.has(tag)){el.replaceWith(...el.childNodes);continue}for(const a of [...el.attributes]){const n=a.name.toLowerCase();if(n.startsWith('on')||['href','src','style'].includes(n))el.removeAttribute(a.name)}}root.setAttribute('display',display);if(ariaLabel)root.setAttribute('aria-label',ariaLabel);return new XMLSerializer().serializeToString(root)}catch{return''}}

function stageNumber(scene){const i=Math.max(0,(course.stages||[]).findIndex(st=>st.id===scene?.stageId));return i+1}
let _semanticNumberMap=null,_formulaNumberMap=null,_referenceIndex=null;
function buildSemanticNumberMap(){if(_semanticNumberMap)return _semanticNumberMap;const out={},counts={};for(const sc of course.scenes||[]){const ch=stageNumber(sc);counts[ch]??={};for(const b of (sc.knowledge?.semanticBlocks||sc.content?.knowledge?.semanticBlocks||[])){if(!b?.id)continue;const k=b.kind||'remark';counts[ch][k]=(counts[ch][k]||0)+1;out[b.id]=b.number||`${ch}.${counts[ch][k]}`}}return _semanticNumberMap=out}
function walkFormulas(obj,cb,path=[]){if(!obj)return;if(Array.isArray(obj)){obj.forEach((v,i)=>walkFormulas(v,cb,path.concat(i)));return}if(typeof obj!=='object')return;if(obj.mathml&&(obj.tex||obj.spoken||obj.ariaLabel)){cb(obj,path);return}for(const [k,v] of Object.entries(obj))walkFormulas(v,cb,path.concat(k))}
function buildFormulaNumberMap(){if(_formulaNumberMap)return _formulaNumberMap;const out={},counts={};for(const sc of course.scenes||[]){const ch=stageNumber(sc);counts[ch]??=0;walkFormulas(sc,(f)=>{if(!f.id)return;counts[ch]++;out[f.id]=f.label||`${ch}.${counts[ch]}`})}return _formulaNumberMap=out}
function sourceIndex(){return Object.fromEntries((course.sources||[]).map((x,i)=>[x.id,{source:x,number:i+1}]))}
function normalizeCitations(cits){return (cits||[]).map(c=>typeof c==='string'?{sourceId:c}:c).filter(Boolean)}
function renderCitations(cits){const idx=sourceIndex(),arr=normalizeCitations(cits).filter(c=>idx[c.sourceId]);if(!arr.length)return'';return `<div class="source-citations"><span class="muted">出处：</span>${arr.map(c=>`<button type="button" class="citation-chip" data-action="citation-ref" data-source-id="${esc(c.sourceId)}" title="${esc(c.locator||c.note||idx[c.sourceId].source.title||'参考资料')}">[${idx[c.sourceId].number}]${c.locator?` ${esc(c.locator)}`:''}</button>`).join('')}</div>`}

function updateMotionDom(scene){const c=widgetContent(scene),root=host.querySelector(`[data-motion-scene="${CSS.escape(scene.id)}"]`);if(!root)return;const st=motionState(scene,c),m=motionCalc(scene,c),b=motionBounds(c);for(const p of c.widgetConfig?.parameters||[]){const el=root.querySelector(`[data-motion-param-value="${CSS.escape(p.id)}"]`),digits=(String(p.step||1).split('.')[1]||'').length;if(el)el.textContent=Number(st.values[p.id]).toFixed(digits)+' '+(p.unit||'')}const map={'飞行时间 T':[m.T,'s'],'水平射程 R':[m.R,'m'],'当前位置 x':[m.x,'m'],'当前位置 y':[m.y,'m'],'竖直速度 vᵧ':[m.vy,'m/s'],'合速度 |v|':[m.speed,'m/s'],'速度偏转角':[m.angle,'°'],'水平速度 vₓ':[m.vx,'m/s']};for(const [k,[v,u]] of Object.entries(map)){const el=root.querySelector(`[data-motion-metric="${CSS.escape(k)}"]`);if(el)el.textContent=Number(v).toFixed(u==='°'?1:2)+' '+u}const main=root.querySelector('[data-motion-main]');if(main)main.innerHTML=motionSvg(scene,c);for(const kind of ['x','y']){const w=root.querySelector(`[data-motion-mini-wrap="${kind}"]`);if(w)w.innerHTML=motionMini(kind,m,b)}const ti=root.querySelector('[data-action="motion-time"]');if(ti){ti.max=String(m.T);ti.step=String(Math.max(.005,m.T/300));ti.value=String(m.t)}const tl=root.querySelector('[data-motion-time-label]');if(tl)tl.textContent=m.t.toFixed(2)+' s';const play=root.querySelector('[data-action="motion-play"]');if(play)play.textContent=st.playing?'暂停':'播放'}
function startMotion(scene){const c=widgetContent(scene),st=motionState(scene,c),m=motionCalc(scene,c);if(st.playing){stopMotion(scene.id);updateMotionDom(scene);return}if(reduceMotion){st.t=st.t>=m.T-.001?0:m.T;st.playing=false;updateMotionDom(scene);return}if(st.t>=m.T-.001)st.t=0;st.playing=true;updateMotionDom(scene);let last=performance.now();const tick=now=>{if(state.sceneId!==scene.id||!st.playing){stopMotion(scene.id);return}const dt=Math.max(0,(now-last)/1000);last=now;const mm=motionCalc(scene,c);st.t=Math.min(mm.T,st.t+dt*(Number(c.widgetConfig?.playbackRate)||1));updateMotionDom(scene);if(st.t>=mm.T){st.t=mm.T;stopMotion(scene.id);updateMotionDom(scene);return}motionTimers[scene.id]=requestAnimationFrame(tick)};motionTimers[scene.id]=requestAnimationFrame(tick)}
function startMotionOnMount(scene){const c=widgetContent(scene),cfg=c.widgetConfig||{},st=motionState(scene,c);if(reduceMotion||cfg.autoplay===false||st.autoStarted)return;st.autoStarted=true;startMotion(scene)}

function project3(p,rx,ry){const ax=rx*Math.PI/180,ay=ry*Math.PI/180;let y=p.y*Math.cos(ax)-p.z*Math.sin(ax),z=p.y*Math.sin(ax)+p.z*Math.cos(ax),x=p.x;const x2=x*Math.cos(ay)+z*Math.sin(ay),z2=-x*Math.sin(ay)+z*Math.cos(ay);return{x:x2,y,z:z2}}
function render3d(scene,c){const cfg=c.widgetConfig||{};state.widget[scene.id]??={rx:cfg.initialRotation?.x??15,ry:cfg.initialRotation?.y??25};const w=state.widget[scene.id],patch=actionState(scene).patch||{};if(Number.isFinite(Number(patch.rx)))w.rx=Number(patch.rx);if(Number.isFinite(Number(patch.ry)))w.ry=Number(patch.ry);const elems=cfg.elements||[],pp={};for(const e of elems)pp[e.id]=project3(e,w.rx,w.ry);const scale=120,ox=400,oy=220;let svg='<svg viewBox="0 0 800 440" role="group" aria-label="离线三维投影">';for(const [edgeIndex,edge] of (cfg.edges||[]).entries()){const a=pp[edge.from],b=pp[edge.to];if(a&&b)svg+=`<line data-3d-edge-index="${edgeIndex}" x1="${ox+a.x*scale}" y1="${oy-a.y*scale}" x2="${ox+b.x*scale}" y2="${oy-b.y*scale}" stroke="var(--muted)" stroke-width="2"></line>`}for(const e of [...elems].sort((a,b)=>pp[a.id].z-pp[b.id].z)){const p=pp[e.id],sel=(state.selected[scene.id]||actionState(scene).selected)===e.id,hi=isHi(scene,e.id);svg+=`<g class="-node ${hi?'highlighted':''}" role="button" tabindex="0" data-ic-element="${esc(e.id)}" aria-selected="${sel}"><circle cx="${ox+p.x*scale}" cy="${oy-p.y*scale}" r="${sel?14:11}" fill="${esc(e.color||'var(--panel)')}" stroke="${sel?'var(--accent)':'var(--border)'}" stroke-width="3"></circle><text x="${ox+p.x*scale+15}" y="${oy-p.y*scale-10}" fill="var(--text)" font-size="13">${esc(e.label)}</text></g>`}svg+='</svg>';const sel=state.selected[scene.id]||actionState(scene).selected||elems[0]?.id,e=elems.find(x=>x.id===sel);return `<div class="param-grid"><div class="param"><label><span>绕 X 轴</span><span>${w.rx}°</span></label><input type="range" min="-180" max="180" value="${w.rx}" data-action="rot3d" data-axis="rx"></div><div class="param"><label><span>绕 Y 轴</span><span>${w.ry}°</span></label><input type="range" min="-180" max="180" value="${w.ry}" data-action="rot3d" data-axis="ry"></div></div><div class="visual-shell"><div class="visual-head"><strong>${esc(cfg.label||'空间结构')}</strong><button type="button" data function renderDataLab(scene,c){const cfg=c.widgetConfig||{},rows=cfg.rows||[],xk=cfg.xKey||Object.keys(rows[0]||{})[0],yk=cfg.yKey||Object.keys(rows[0]||{})[1],chart=cfg.chart||'scatter',vals=dataLabValues(scene,c),reg=cfg.model?.kind==='linear-regression'?regressionStats(rows,xk,yk,vals):null;let controls='';if(cfg.parameters?.length){controls='<div class="experiment-panel"><h4>自行调节参数</h4><p class="muted">每次只改变一个参数，观察图形与指标如何响应，再尝试解释原因。</p><div class="param-grid">';for(const p of cfg.parameters){const v=vals[p.id],digits=(String(p.step||1).split('.')[1]||'').length;controls+=`<div class="param"><label><span>${esc(p.label)}</span><span data-data-value="${esc(p.id)}">${v.toFixed(digits)}</span></label><input type="range" data-action="data-input" data-param-id="${esc(p.id)}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}"></div>`}controls+='</div></div>'}

host.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,scene=sceneById(state.sceneId);if(a==='process-prev'||a==='process-next'){const c=widgetContent(scene),st=processAnimationState(scene,c);stopProcessAnimation(scene.id);st.i=clamp(st.i+(a==='process-next'?1:-1),0,Math.max(0,(c.widgetConfig?.steps||[]).length-1));updateProcessAnimationDom(scene);return}if(a==='process-jump'){const c=widgetContent(scene),st=processAnimationState(scene,c),n=(c.widgetConfig?.steps||[]).length;stopProcessAnimation(scene.id);st.i=clamp(Number(b.dataset.stepIndex||0),0,Math.max(0,n-1));updateProcessAnimationDom(scene);return}if(a==='process-replay'){const c=widgetContent(scene),st=processAnimationState(scene,c);stopProcessAnimation(scene.id);st.i=0;updateProcessAnimationDom(scene);if(!reduceMotion)scheduleProcessAnimation(scene);return}if(a==='process-play'){const c=widgetContent(scene),st=processAnimationState(scene,c);if(st.playing){stopProcessAnimation(scene.id);updateProcessAnimationDom(scene)}else scheduleProcessAnimation(scene);return}if(a==='random-run'){const c=widgetContent(scene);runRandomTrials(scene,c);updateRandomTrialDom(scene);return}if(a==='random-more'){const c=widgetContent(scene),st=randomTrialState(scene,c),max=Number(c.widgetConfig?.maxTrials||1000);st.n=Math.min(max,Math.max(1,Math.round(st.n*2)));const inp=host.querySelector('[data-action="random-n"]');if(inp)inp.value=st.n;runRandomTrials(scene,c);updateRandomTrialDom(scene);return}if(a==='fbd-check'){labState('fbd',scene,{selected:[],checked:false}).checked=true;return renderScene('preserve')}if(a==='fbd-reset'){state.fbd[scene.id]={selected:[],checked:false};return renderScene('preserve')}if(a==='search-prev'||a==='search-next'){const st=labState('searchTree',scene,{i:0}),steps=widgetContent(scene).widgetConfig?.steps||[];st.i=clamp(st.i+(a==='search-next'?1:-1),0,Math.max(0,steps.length-1));return renderScene('preserve')}if(a==='search-reset'){state.searchTree[scene.id]={i:0};return renderScene('preserve')}});
host.addEventListener('input',e=>{const t=e.target,a=t.dataset.action,scene=sceneById(state.sceneId);if(a==='random-n'){const c=widgetContent(scene),st=randomTrialState(scene,c);st.n=Number(t.value);runRandomTrials(scene,c);updateRandomTrialDom(scene);return}if(a==='explain-text'){explainBackState(scene).text=t.value;return}if(a==='solid-param'){const c=widgetContent(scene),cfg=c.widgetConfig||{},st=solidGeometryState(scene,c),shape=(cfg.shapes||[]).find(x=>x.id===st.shape);if(shape&&(shape.parameters||[]).some(p=>p.id===t.dataset.paramId)){st.values[t.dataset.paramId]=Number(t.value);updateSolidGeometryDom(scene)}return}if(a==='circuit-input'){const st=labState('circuit',scene,{}),cfg=widgetContent(scene).widgetConfig||{},r=cfg.resistors?.find(x=>x.id===t.dataset.resistorId);if(r)st[r.id]=clamp(Number(t.value),r.min??1,r.max??100);updateCircuitDom(scene);return}if(a==='stats-input'){const st=labState('stats',scene,{});st[t.dataset.statId]=Number(t.value);updateStatsDom(scene);return}if(a==='ml-boundary-input'){const st=labState('mlBoundary',scene,{});st[t.dataset.paramId]=Number(t.value);updateMlBoundaryDom(scene);return}if(a==='rec-n'){const c=widgetContent(scene),st=recursionState(scene,c);st.n=Number(t.value);st.i=0;return renderScene('preserve')}if(a==='cx-n'){const c=widgetContent(scene),st=complexityState(scene,c);st.n=Number(t.value);updateComplexityDom(scene);return}});
let geomDrag=null;host.addEventListener('pointerdown',e=>{const p=e.target.closest('.geom-point'),svg=e.target.closest('.geometry-svg');if(!p||!svg)return;const scene=sceneById(state.sceneId),cfg=widgetContent(scene).widgetConfig||{},def=cfg.points?.find(x=>x.id===p.dataset.geomId);if(!def?.draggable)return;geomDrag={sceneId:scene.id,id:def.id,svg};p.setPointerCapture?.(e.pointerId)});host.addEventListener('pointermove',e=>{if(!geomDrag||geomDrag.sceneId!==state.sceneId)return;const scene=sceneById(geomDrag.sceneId),cfg=widgetContent(scene).widgetConfig||{},b=cfg.bounds||{xmin:-5,xmax:5,ymin:-5,ymax:5},r=geomDrag.svg.getBoundingClientRect(),px=clamp((e.clientX-r.left)/r.width,0,1),py=clamp((e.clientY-r.top)/r.height,0,1);state.geometry[scene.id]??={points:{}};state.geometry[scene.id].points[geomDrag.id]={x:b.xmin+px*(b.xmax-b.xmin),y:b.ymax-py*(b.ymax-b.ymin)};updateGeometryDom(scene)});host.addEventListener('pointerup',()=>geomDrag=null);host.addEventListener('pointercancel',()=>geomDrag=null);

let tocRaf=0;window.addEventListener('scroll',()=>{if(tocRaf)return;tocRaf=requestAnimationFrame(()=>{tocRaf=0;updateTocActive()})},{passive:true});

const FEEDBACK_TYPES=new Set(['unclear-explanation','missing-example','incorrect-content','interaction-friction','math-or-notation','pacing-or-depth','source-question','worked-well','figure-helpful','figure-confusing-or-missing','animation-content-mismatch','animation-too-fast','animation-misleading','animation-helpful']);
function renderFeedbackDialog(){const scene=sceneById(state.sceneId);if(feedbackSceneTitle)feedbackSceneTitle.textContent=`当前：${scene?.title||'学习页'}`;if(feedbackCount)feedbackCount.textContent=`当前 ${state.sessionFeedback.observations.length} 条主动反馈。`}
function addFeedbackObservation(){const scene=sceneById(state.sceneId),types=[...feedbackDialog.querySelectorAll('#feedbackIssueGrid input:checked')].map(x=>x.value).filter(x=>FEEDBACK_TYPES.has(x)),rating=Number(feedbackDialog.querySelector('input[name="feedbackRating"]:checked')?.value||0),note=String(feedbackNote?.value||'').trim(),scope=feedbackScope?.value||'unknown';if(!types.length&&!rating&&!note){announce('请至少选择一个反馈类型、评分或填写说明');return}state.sessionFeedback.observations.push({sceneId:scene?.id||null,sceneTitle:scene?.title||'',objectiveIds:scene?.objectiveIds||[],types,rating:rating||null,note,scopeHint:scope,recordedAt:new Date().toISOString()});feedbackDialog.querySelectorAll('#feedbackIssueGrid input').forEach(x=>x.checked=false);feedbackDialog.querySelectorAll('input[name="feedbackRating"]').forEach(x=>x.checked=false);if(feedbackNote)feedbackNote.value='';if(feedbackScope)feedbackScope.value='unknown';renderFeedbackDialog();announce('已加入本次学习反馈')}
function sessionFeedbackBundle(){return{schema:'interactive-classroom-session-feedback',explicitUserExport:true,exportedAt:new Date().toISOString(),course:{title:course.meta?.title||course.title||document.title,courseId:course.meta?.id||null,schemaProfile:'stage-scene',disciplinePack:course.meta?.disciplinePack||null,secondaryPacks:course.meta?.secondaryPacks||[]},policy:{telemetry:'explicit-user-entered-only',automaticSkillChange:false},observations:structuredClone(state.sessionFeedback.observations)}}
function exportSessionFeedback(){if(!state.sessionFeedback.observations.length){announce('还没有主动反馈可导出');return}const data=JSON.stringify(sessionFeedbackBundle(),null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a'),slug=String(course.meta?.disciplinePack||'course').replace(/[^a-z0-9-]+/gi,'-');a.href=url;a.download=`interactive-classroom-feedback-${slug}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('已导出学习反馈')}
feedbackBtn?.addEventListener('click',()=>{renderFeedbackDialog();feedbackDialog?.showModal()});document.querySelector('#feedbackCloseBtn')?.addEventListener('click',()=>feedbackDialog?.close());document.querySelector('#feedbackAddBtn')?.addEventListener('click',addFeedbackObservation);document.querySelector('#feedbackExportBtn')?.addEventListener('click',exportSessionFeedback);document.querySelector('#feedbackClearBtn')?.addEventListener('click',()=>{state.sessionFeedback.observations=[];renderFeedbackDialog();announce('已清空本次主动反馈')});
bookmarkCurrentBtn?.addEventListener('click',()=>{const id=state.sceneId,arr=state.nav.bookmarks||[];state.nav.bookmarks=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];renderNav();announce(state.nav.bookmarks.includes(id)?'已收藏本页':'已取消收藏')});bookmarksOnlyBtn?.addEventListener('click',()=>{state.nav.bookmarksOnly=!state.nav.bookmarksOnly;renderNav()});bibliographyBtn?.addEventListener('click',()=>{renderBibliography();bibliographyDialog?.showModal()});document.querySelector('#bibliographyCloseBtn')?.addEventListener('click',()=>bibliographyDialog?.close());document.querySelector('#resetBtn').addEventListener('click',()=>{Object.keys(animationTimers).forEach(stopDiagramAnimation);Object.keys(processAnimationTimers).forEach(stopProcessAnimation);Object.keys(motionTimers).forEach(stopMotion);state=structuredClone(initialState);announce('课堂已重置');render('navigation')});
render('initial');
