interface:
 display_name: "Interactive Classroom"
 short_description: "Say what you want to learn; get a deep, polished offline interactive course"
 default_prompt: "Use $interactive-classroom automatically for a structured learning request. Treat a topic-only request as ic-learn. Default ordinary learning intent to the learn-deep profile: infer scope/level, route the discipline, map prerequisites/objectives/misconceptions, then teach each substantial core concept with enough prerequisite connection, intuition, precise definition/mechanism, reasoning chain, worked example/evidence, boundaries/misconceptions and self-check before using interactive widgets. For substantive mathematics or symbolic notation, use native MathML Core with TeX/spoken fallback and never leave equations/inequalities embedded only in prose strings; use structured formula atoms inside rich narrative. When process diagrams benefit from sequence, add bounded next/play/pause/replay animation with reduced-motion support. When a concept has meaningful parameters, prefer learner-adjustable local experiments (for example physics quantities, regression parameters, simulation inputs, or chemistry coefficients) over fixed demonstrations. For kinematics where multiple representations matter, prefer motion-lab: synchronize the physical animation, velocity components, time scrubber, time graphs, derived quantities and recorded control-variable trials with fixed comparison scales. When formal knowledge naturally uses named statements, encode Definition/Lemma/Theorem/Proof/Example/Exercise as stable textbook semantic blocks with linked proofs and nearby practice; attach stable sources/citations when grounding matters, let the renderer auto-number blocks/formulas, and use proof-practice / quantity-lab / chemistry widgets when the discipline requires them instead of flattening them into generic cards. For Language prefer meaning-form-use with cloze/sentence-builder/grammar-tree; for Humanities preserve source status/context and use source-comparison/argument-map; for Social Science expose causal assumptions and evidence limits through causal-dag/evidence-matrix. For geometry/spatial topics, plan explanation-first pedagogical figures (concept/compare/step/reasoning/misconception) inside the prose flow before labs; use figures to build the mental model, not as decoration. For mastery-loop source courses, prefer a standard worked example plus a contrast/boundary example, then guided → independent → transfer/retrieval practice before the independent mastery gate. Choose the frontend runtime intentionally. Before complexity routing, treat natural-language depth requests such as “详细讲解…课程”, “详细的讲解…”, “详细地为我讲解…”, “细致/详尽/深入讲解…”, “高质量讲解…”, or “detailed / in-depth / thorough interactive course” as a strong Modern Runtime trigger; explicit portable/zero-build/不要 React constraints override it. For ordinary straightforward requests use the portable single-file renderer; for triggered depth requests, component/state complexity, synchronized views, rich gestures/visualizations, or an explicit React/Tailwind/Motion request, use the pinned React + compiled Tailwind + Motion modern runtime and bundle it locally at generation time. In either profile compile one calm textbook/documentation-style offline HTML with no learner-runtime CDN/network dependency. Preserve scroll position during in-scene interactions; on scene navigation place the new scene heading below the viewport top with reading margin rather than snapping to document top. Validate before delivery. If a user provides or asks to use an exported learning-feedback refinement bundle, validate it first, classify course/Pack/core scope, reproduce issues, and require regression coverage before changing reusable rules; never treat one rating or unsupported correction as automatic truth. Do not require the user to name modes, widgets, API keys, servers, or validator commands."
